<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found | The Midnight Draw</title>
  <meta name="robots" content="noindex,follow">
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    :root{--cream:#f5f0e6;--black:#09080b;--gold:#b49356;--ink:#171417}
    *{box-sizing:border-box}
    html,body{min-height:100%}
    body{margin:0;background:var(--black);color:var(--cream);font-family:Georgia,"Times New Roman",serif}
    a{color:inherit}
    .shell{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto}
    header{padding:24px 5%;border-bottom:1px solid rgba(180,147,86,.28);background:var(--cream);color:var(--ink)}
    .brand{text-decoration:none;display:inline-block;line-height:1}
    .brand-name{display:block;font-size:18px;letter-spacing:.14em;text-transform:uppercase}
    .brand-subtitle{display:block;margin-top:7px;color:var(--gold);font-family:Arial,Helvetica,sans-serif;font-size:9px;letter-spacing:.3em;text-transform:uppercase}
    main{display:grid;place-items:center;padding:70px 24px;text-align:center;background:radial-gradient(circle at center,rgba(180,147,86,.10),transparent 48%)}
    .content{max-width:760px}
    .code{margin:0 0 16px;color:var(--gold);font-family:Arial,Helvetica,sans-serif;font-size:12px;letter-spacing:.28em;text-transform:uppercase}
    h1{margin:0;font-weight:400;font-size:clamp(54px,9vw,112px);line-height:.92;letter-spacing:-.04em}
    .rule{width:64px;height:1px;background:var(--gold);margin:30px auto}
    p{margin:0 auto;max-width:560px;color:rgba(245,240,230,.78);font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.7}
    .actions{margin-top:32px;display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
    .btn{display:inline-block;border:1px solid var(--gold);background:var(--gold);color:var(--black);text-decoration:none;padding:14px 24px;font-family:Arial,Helvetica,sans-serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
    .btn.secondary{background:transparent;color:var(--cream)}
    .btn:hover,.btn:focus-visible{outline:2px solid var(--cream);outline-offset:3px}
    footer{text-align:center;padding:24px;color:rgba(245,240,230,.55);font-family:Arial,Helvetica,sans-serif;font-size:10px;border-top:1px solid rgba(180,147,86,.18)}
    @media(max-width:560px){header{padding:20px}.brand-name{font-size:14px}.brand-subtitle{font-size:7px}.actions{flex-direction:column;align-items:stretch}.btn{width:100%;max-width:320px;margin:auto}}
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <a class="brand" href="index.html" aria-label="The Midnight Draw home">
        <span class="brand-name">The Midnight Draw</span>
        <span class="brand-subtitle">Tarot Readings</span>
      </a>
    </header>

    <main>
      <div class="content">
        <p class="code">404 • Card Not Found</p>
        <h1>This path<br>wasn’t in the cards.</h1>
        <div class="rule"></div>
        <p>The page you were looking for has disappeared into the ether. You can return home or head straight to the inquiry page.</p>
        <div class="actions">
          <a class="btn" href="index.html">Return Home</a>
          <a class="btn secondary" href="contact.html">Booking Inquiry</a>
        </div>
      </div>
    </main>

    <footer>© 2026 The Midnight Draw. All rights reserved.</footer>
  </div>
</body>
</html>
