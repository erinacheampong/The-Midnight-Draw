<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="The Midnight Draw offers intuitive tarot readings for gatherings and celebrations in Southern California.">
  <title>The Midnight Draw | Intuitive Tarot for Events</title>
  <style>
    :root {
      --ink: #070707;
      --paper: #f3eee7;
      --accent: #b9a48c;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; background: var(--ink); }
    body {
      margin: 0;
      background: var(--ink);
      color: var(--paper);
      font-family: Arial, Helvetica, sans-serif;
    }
    main { width: 100%; overflow: hidden; }
    .panel {
      position: relative;
      width: 100%;
      line-height: 0;
      background: var(--ink);
    }
    .panel img {
      display: block;
      width: 100%;
      height: auto;
    }
    .booking-link {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 20;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 13px 20px;
      border: 1px solid var(--accent);
      background: rgba(7, 7, 7, 0.92);
      color: var(--paper);
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: 12px;
      line-height: 1;
      backdrop-filter: blur(6px);
    }
    .booking-link:hover,
    .booking-link:focus {
      background: var(--paper);
      color: var(--ink);
      outline: none;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }
    footer {
      padding: 28px 20px 84px;
      text-align: center;
      background: var(--ink);
      color: #cfc6bb;
      font-size: 12px;
      line-height: 1.6;
      letter-spacing: .04em;
    }
    footer a { color: inherit; }
    @media (max-width: 600px) {
      .booking-link {
        right: 12px;
        bottom: 12px;
        min-height: 44px;
        padding: 12px 16px;
        font-size: 11px;
      }
    }
  </style>
</head>
<body>
  <a class="sr-only" href="#content">Skip to content</a>

  <main id="content">
    <section class="panel" aria-label="The Midnight Draw">
      <img src="01-hero.png" alt="The Midnight Draw intuitive tarot readings for events">
    </section>

    <section class="panel" aria-label="What to expect">
      <img src="02-what-to-expect.png" alt="What to expect from a Midnight Draw tarot reading">
    </section>

    <section class="panel" aria-label="Offerings">
      <img src="03-offerings.png" alt="Tarot reading offerings for celebrations and gatherings">
    </section>

    <section class="panel" aria-label="Booking">
      <img src="04-booking.png" alt="Book The Midnight Draw for your event">
    </section>
  </main>

  <a class="booking-link"
     href="https://docs.google.com/forms/d/e/1FAIpQLSdqI_BsCOU35TDAajJOIOAgf1tnV3roDa6oxRInF-iEAnyklg/viewform"
     target="_blank"
     rel="noopener noreferrer">
    Booking Inquiry
  </a>

  <footer>
    © 2026 The Midnight Draw<br>
    Connect with us
    <a href="https://www.instagram.com/themidnightdraw/" target="_blank" rel="noopener noreferrer">@themidnightdraw</a>
  </footer>
</body>
</html>
