<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta
    name="description"
    content="The Midnight Draw offers intuitive tarot readings for gatherings and celebrations in Southern California."
  >

  <title>The Midnight Draw | Tarot Readings</title>

  <style>
    :root {
      --cream: #f5f0e6;
      --black: #09080b;
      --gold: #b49356;
      --text: #171417;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      background: var(--black);
    }

    body {
      margin: 0;
      background: var(--black);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
    }

    /* UNIVERSAL HEADER */

    .site-header {
      width: 100%;
      background: var(--cream);
      border-bottom: 1px solid rgba(180, 147, 86, 0.25);
      position: relative;
      z-index: 20;
    }

    .header-inner {
      max-width: 1400px;
      margin: 0 auto;
      padding: 22px 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
    }

    .brand-lockup {
      color: var(--text);
      text-decoration: none;
      line-height: 1;
    }

    .brand-name {
      display: block;
      font-size: 18px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .brand-subtitle {
      display: block;
      margin-top: 7px;
      font-size: 9px;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: var(--gold);
    }

    .main-nav {
      display: flex;
      align-items: center;
      gap: 30px;
    }

    .main-nav a {
      color: var(--text);
      text-decoration: none;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding-bottom: 5px;
      border-bottom: 1px solid transparent;
      transition: color 0.2s ease, border-color 0.2s ease;
    }

    .main-nav a:hover,
    .main-nav a:focus-visible {
      color: var(--gold);
    }

    .main-nav a.active {
      color: var(--gold);
      border-bottom-color: var(--gold);
    }

    /* CURRENT HOMEPAGE */

    main {
      width: 100%;
      overflow: hidden;
    }

    .section {
      position: relative;
      width: 100%;
      line-height: 0;
      background: var(--black);
    }

    .section img {
      display: block;
      width: 100%;
      height: auto;
    }

    .click-area {
      position: absolute;
      display: block;
      z-index: 3;
      border-radius: 12px;
    }

    .click-area:focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 4px;
    }

    .hero .click-area {
      left: 9.5%;
      top: 75%;
      width: 37%;
      height: 10%;
    }

    .booking .click-area {
      left: 12.5%;
      top: 64%;
      width: 38%;
      height: 13%;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* UNIVERSAL FOOTER */

    .site-footer {
      background: var(--black);
      color: var(--cream);
      text-align: center;
      padding: 52px 20px 34px;
      border-top: 1px solid rgba(180, 147, 86, 0.28);
    }

    .footer-title {
      margin: 0 0 15px;
      color: var(--gold);
      font-size: 12px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-weight: normal;
    }

    .instagram-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--cream);
      text-decoration: none;
      font-size: 14px;
      letter-spacing: 0.04em;
    }

    .instagram-link:hover,
    .instagram-link:focus-visible {
      color: var(--gold);
    }

    .instagram-icon {
      width: 16px;
      height: 16px;
      display: inline-block;
    }

    .copyright {
      margin: 30px 0 0;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 10px;
      letter-spacing: 0.04em;
      color: rgba(245, 240, 230, 0.62);
    }

    /* MOBILE */

    @media (max-width: 700px) {
      .header-inner {
        padding: 18px 20px;
        gap: 16px;
      }

      .brand-name {
        font-size: 13px;
      }

      .brand-subtitle {
        font-size: 7px;
        letter-spacing: 0.25em;
        margin-top: 5px;
      }

      .main-nav {
        gap: 13px;
      }

      .main-nav a {
        font-size: 10px;
        letter-spacing: 0.04em;
      }

      .hero .click-area {
        left: 9%;
        top: 74%;
        width: 39%;
        height: 11%;
      }

      .booking .click-area {
        left: 11%;
        top: 62%;
        width: 42%;
        height: 15%;
      }

      .site-footer {
        padding: 42px 20px 28px;
      }
    }

    @media (max-width: 430px) {
      .header-inner {
        align-items: flex-start;
        flex-direction: column;
        gap: 15px;
      }

      .main-nav {
        width: 100%;
        justify-content: space-between;
      }
    }
  </style>
</head>

<body>

  <!-- UNIVERSAL HEADER -->
  <header class="site-header">
    <div class="header-inner">

      <a class="brand-lockup" href="index.html" aria-label="The Midnight Draw home">
        <span class="brand-name">The Midnight Draw</span>
        <span class="brand-subtitle">Tarot Readings</span>
      </a>

      <nav class="main-nav" aria-label="Main navigation">
        <a class="active" href="index.html">Home</a>
        <a href="faq.html">FAQ</a>
        <a href="contact.html">Contact</a>
      </nav>

    </div>
  </header>

  <main>

    <!-- CURRENT HOMEPAGE HERO -->
    <section class="section hero" aria-label="The Midnight Draw hero">

      <img
        src="01-hero.png"
        alt="The Midnight Draw immersive tarot card readings"
      >

      <a
        class="click-area"
        href="contact.html"
        aria-label="Inquire about a tarot reading"
      >
        <span class="sr-only">Booking Inquiry</span>
      </a>

    </section>

    <!-- WHAT TO EXPECT -->
    <section class="section" aria-label="What to expect">

      <img
        src="02-what-to-expect.png"
        alt="Reflection, connection, and a little magic"
        loading="lazy"
      >

    </section>

    <!-- EXPERIENCES -->
    <section class="section" aria-label="Tarot experiences">

      <img
        src="03-offerings.png"
        alt="Tarot experiences for private celebrations, seasonal gatherings, markets, special events, and brand activations"
        loading="lazy"
      >

    </section>

    <!-- BOOKING -->
    <section class="section booking" aria-label="Booking inquiry">

      <img
        src="04-booking.png"
        alt="Invite The Midnight Draw to your gathering"
        loading="lazy"
      >

      <a
        class="click-area"
        href="contact.html"
        aria-label="Inquire about your event"
      >
        <span class="sr-only">Inquire About Your Event</span>
      </a>

    </section>

  </main>

  <!-- UNIVERSAL FOOTER -->
  <footer class="site-footer">

    <p class="footer-title">Let’s Connect</p>

    <a
      class="instagram-link"
      href="https://www.instagram.com/themidnightdraw/"
      target="_blank"
      rel="noopener"
      aria-label="Follow The Midnight Draw on Instagram"
    >
      <svg
        class="instagram-icon"
        viewBox="0 0 24 24"
        aria-hidden="true"
        fill="none"
        stroke="currentColor"
        stroke-width="1.6"
      >
        <rect x="3" y="3" width="18" height="18" rx="5"></rect>
        <circle cx="12" cy="12" r="4"></circle>
        <circle cx="17.5" cy="6.5" r="1"></circle>
      </svg>

      @themidnightdraw
    </a>

    <p class="copyright">
      © 2026 The Midnight Draw. All rights reserved.
    </p>

  </footer>

</body>
</html>
