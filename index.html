<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>The Midnight Draw</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      background: #050407;
    }

    body {
      margin: 0;
      background: #050407;
      color: #f4efe8;
      font-family: Arial, Helvetica, sans-serif;
    }

    img {
      display: block;
      width: 100%;
      height: auto;
    }

    .booking {
      padding: 50px 20px 60px;
      text-align: center;
      background: #050407;
    }

    .booking a {
      display: inline-block;
      padding: 16px 30px;
      border: 1px solid #b8a790;
      color: #f4efe8;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 13px;
    }

    .booking a:hover {
      background: #f4efe8;
      color: #050407;
    }

    footer {
      padding: 25px 20px 40px;
      text-align: center;
      background: #050407;
      color: #c8beb2;
      font-size: 12px;
      line-height: 1.7;
    }

    footer a {
      color: #c8beb2;
    }
  </style>
</head>

<body>

  <main>
    <img
      src="midnight-draw-2.png"
      alt="The Midnight Draw intuitive tarot readings"
    >

    <img
      src="midnight-draw-2 (1).png"
      alt="The Midnight Draw event tarot experience"
    >

    <section class="booking">
      <a
        href="https://docs.google.com/forms/d/e/1FAIpQLSdqI_BsCOU35TDAajJOIOAgf1tnV3roDa6oxRInF-iEAnyklg/viewform"
        target="_blank"
        rel="noopener noreferrer"
      >
        Booking Inquiry
      </a>
    </section>
  </main>

  <footer>
    © 2026 The Midnight Draw<br>
    Connect with us
    <a
      href="https://www.instagram.com/themidnightdraw/"
      target="_blank"
      rel="noopener noreferrer"
    >
      @themidnightdraw
    </a>
  </footer>

</body>
</html>
