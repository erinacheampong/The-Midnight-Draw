name: Build card assets

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-card-assets.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: clean-rebuild
      - name: Decode card artwork
        run: |
          base64 -d draw-high-priestess-v3.webp.txt > draw-high-priestess-v3.webp
          base64 -d draw-wheel-of-fortune-v3.webp.b64 > draw-wheel-of-fortune-v3.webp
          base64 -d draw-nine-of-pentacles-v3.webp.b64 > draw-nine-of-pentacles-v3.webp
          file draw-high-priestess-v3.webp draw-wheel-of-fortune-v3.webp draw-nine-of-pentacles-v3.webp
      - name: Commit card artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add draw-high-priestess-v3.webp draw-wheel-of-fortune-v3.webp draw-nine-of-pentacles-v3.webp
          git commit -m "Build final Draw card artwork" || exit 0
          git push origin HEAD:clean-rebuild
