<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="The Midnight Draw offers thoughtful, intuitive tarot readings for private events, girls nights, and themed gatherings throughout Southern California.">
  <title>The Midnight Draw | Tarot Readings for Events</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #080808; }
    body { font-family: Arial, sans-serif; }
    .page {
      position: relative;
      width: 100%;
      max-width: 1536px;
      margin: 0 auto;
      line-height: 0;
    }
    .page img {
      display: block;
      width: 100%;
      height: auto;
    }
    .booking-link {
      position: absolute;
      display: block;
      z-index: 2;
      border-radius: 4px;
      text-indent: -9999px;
      overflow: hidden;
    }
    .booking-link:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 3px;
    }
    .booking-top {
      left: 36.7%;
      top: 20.4%;
      width: 20.2%;
      height: 3.0%;
    }
    .booking-bottom {
      left: 35.7%;
      top: 93.7%;
      width: 27.0%;
      height: 3.1%;
    }
  </style>
</head>
<body>
  <main class="page">
    <img src="midnight-draw-2.png" alt="The Midnight Draw tarot readings for private events, girls nights, and themed gatherings in Southern California.">

    <a class="booking-link booking-top"
       href="https://docs.google.com/forms/d/e/1FAIpQLSdqI_BsCOU35TDAajJOIOAgf1tnV3roDa6oxRInF-iEAnyklg/viewform"
       target="_blank" rel="noopener noreferrer"
       aria-label="Open The Midnight Draw booking inquiry form">
      Booking Inquiry
    </a>

    <a class="booking-link booking-bottom"
       href="https://docs.google.com/forms/d/e/1FAIpQLSdqI_BsCOU35TDAajJOIOAgf1tnV3roDa6oxRInF-iEAnyklg/viewform"
       target="_blank" rel="noopener noreferrer"
       aria-label="Open The Midnight Draw booking inquiry form">
      Booking Inquiry
    </a>
  </main>
</body>
</html>
