<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Inquire about bringing The Midnight Draw to your gathering or event.">
  <title>Contact | The Midnight Draw</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a class="brand-lockup" href="index.html" aria-label="The Midnight Draw home">
      <span class="brand-name">The Midnight Draw</span>
      <span class="brand-subtitle">Tarot Readings</span>
    </a>
    <nav class="main-nav" aria-label="Main navigation">
      <a href="index.html">Home</a>
<a href="about.html">About</a>
<a href="gallery.html">Gallery</a>
<a href="faq.html">FAQ</a>
<a href="contact.html" class="active">Contact</a>
    </nav>
  </div>
</header>


<main>
  <section class="contact-hero">
    <div class="contact-hero-inner">
      <div>
        <h1>Let’s bring a little magic to your next gathering.</h1>
        <p class="body-copy">Tell me a little about your event and I’ll be in touch soon.</p>
      </div>
      <div><img src="assets/images/contact-hero.jpg" alt="Deep brown hands arranging tarot cards"></div>
    </div>
  </section>

  <section class="contact-main">
    <div class="form-shell">
      <h2 class="form-title">Inquire About Your Event</h2>

      <form id="inquiry-form" action="https://formspree.io/f/xkjwbwgp" method="POST">
        <div class="form-grid">
          <div class="field"><label for="name">Full Name</label><input id="name" name="name" type="text" autocomplete="name" required></div>
          <div class="field"><label for="email">Email Address</label><input id="email" name="email" type="email" autocomplete="email" required></div>
          <div class="field"><label for="phone">Phone Number</label><input id="phone" name="phone" type="tel" autocomplete="tel" required></div>
          <div class="field"><label for="event-date">Event Date</label><input id="event-date" name="event_date" type="date" required></div>
          <div class="field"><label for="event-time">Event Start Time</label><input id="event-time" name="event_start_time" type="time" required></div>
          <div class="field"><label for="location">Event Location</label><input id="location" name="event_location" type="text" placeholder="City or venue" required></div>

          <div class="field">
            <label for="event-type">Type of Event</label>
            <select id="event-type" name="event_type" required>
              <option value="" selected disabled>Select one</option>
              <option>Private Celebration (Birthday, Girls Night)</option>
              <option>Seasonal Gathering</option>
              <option>Market / Pop Up</option>
              <option>Special Event</option>
              <option>Brand Activation / Corporate Event</option>
              <option>Other</option>
            </select>
          </div>

          <div class="field"><label for="guest-count">Estimated Guest Count</label><input id="guest-count" name="estimated_guest_count" type="number" min="1" required></div>

          <div class="field">
            <label for="reading-time">Requested Reading Time</label>
            <select id="reading-time" name="requested_reading_time" required>
              <option value="" selected disabled>Select one</option>
              <option>2 Hours</option>
              <option>3 Hours</option>
              <option>Not Sure Yet</option>
            </select>
          </div>

          <div class="field">
            <label for="referral">How did you hear about The Midnight Draw?</label>
            <select id="referral" name="referral_source" required>
              <option value="" selected disabled>Select one</option>
              <option>Instagram</option>
              <option>Google</option>
              <option>Referral</option>
              <option>Event or Market</option>
              <option>Other</option>
            </select>
          </div>

          <div class="field full">
            <label for="details">Tell Me About Your Event</label>
            <textarea id="details" name="event_details" placeholder="Share any details, theme, or anything else you'd like me to know." required></textarea>
          </div>
        </div>

        <div class="checkbox-row">
          <input id="acknowledgement" name="acknowledgement" type="checkbox" value="I understand submitting an inquiry does not reserve my date" required>
          <label for="acknowledgement">I understand that submitting an inquiry does not reserve my date.</label>
        </div>

        <input type="hidden" name="_subject" value="New Midnight Draw Event Inquiry">

        <div class="form-actions"><button class="btn" type="submit">Send Inquiry</button></div>
        <div id="form-status" class="form-status" role="status" aria-live="polite"></div>
      </form>
    </div>
  </section>
</main>


<footer class="site-footer">
  <p class="footer-title">Let’s Connect</p>
  <a class="instagram-link" href="https://www.instagram.com/themidnightdraw/" target="_blank" rel="noopener" aria-label="Follow The Midnight Draw on Instagram">
    <svg class="instagram-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6">
      <rect x="3" y="3" width="18" height="18" rx="5"></rect>
      <circle cx="12" cy="12" r="4"></circle>
      <circle cx="17.5" cy="6.5" r="1"></circle>
    </svg>
    @themidnightdraw
  </a>
  <p class="copyright">© 2026 The Midnight Draw. All rights reserved.</p>
</footer>

<script src="assets/js/site.js"></script>
</body>
</html>
