<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="The Midnight Draw offers intuitive tarot readings for gatherings and celebrations in Southern California.">
  <title>The Midnight Draw | Intuitive Tarot for Events</title>
  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; background: #070707; }
    body {
      margin: 0;
      background: #070707;
      color: #f3eee7;
      font-family: Arial, Helvetica, sans-serif;
    }
    main {
      width: 100%;
      overflow: hidden;
    }
    .panel {
      width: 100%;
      line-height: 0;
      background: #070707;
    }
    .panel img {
      display: block;
      width: 100%;
      height: auto;
    }
    .booking-panel {
      position: relative;
    }
    .booking-panel a {
      position: absolute;
      left: 50%;
      bottom: 10%;
      transform: translateX(-50%);
      width: min(260px, 56vw);
      height: 12%;
      min-height: 44px;
      text-indent: -9999px;
      overflow: hidden;
    }
    footer {
      padding: 24px 20px 32px;
      text-align: center;
      background: #070707;
      color: #cfc6bb;
      font-size: 12px;
      line-height: 1.6;
    }
    footer a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <section class="panel">
      <img src="01-hero.png" alt="The Midnight Draw intuitive tarot readings for events">
    </section>

    <section class="panel">
      <img src="02-what-to-expect.png" alt="What to expect from a Midnight Draw tarot reading">
    </section>

    <section class="panel">
      <img src="03-offerings.png" alt="Tarot reading offerings for celebrations and gatherings">
    </section>

    <section class="panel booking-panel">
      <img src="04-booking.png" alt="Book The Midnight Draw for your event">
      <a href="https://docs.google.com/forms/d/e/1FAIpQLSdqI_BsCOU35TDAajJOIOAgf1tnV3roDa6oxRInF-iEAnyklg/viewform"
         target="_blank"
         rel="noopener noreferrer"
         aria-label="Open booking inquiry form">Booking Inquiry</a>
    </section>

    <section class="panel">
      <img src="05-footer.png" alt="">
    </section>
  </main>

  <footer>
    © 2026 The Midnight Draw ·
    <a href="https://www.instagram.com/themidnightdraw/" target="_blank" rel="noopener noreferrer">@themidnightdraw</a>
  </footer>
</body>
</html>
